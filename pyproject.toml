[project]
name = "swanlab-mcp"
dynamic = ["version"]
description = "MCP (Model Context Protocol) server support for SwanLab"
authors = [{ name = "CaddiesNew", email = "nexisato0810@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "swanlab>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swanlab_mcp"]

[project.scripts]
swanlab_mcp = "swanlab_mcp.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.3.0", "ruff>=0.14.3"]

[tool.hatch.version]
path = "src/swanlab_mcp/_version.py"


[tool.ruff]
line-length = 122
target-version = "py312"
include = ["**/*.py", "**/*.pyi"]
src = ["src"]
exclude = [".git", ".ruff_cache", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# 显式锁定默认规则集：AGENTS.md 约定使用 typing.Dict/List 等，不启用 UP/BLE 等扩展规则
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["constants", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
